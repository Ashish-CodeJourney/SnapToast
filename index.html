<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>SnapToast</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<button id="theme-toggle" aria-label="Toggle dark/light mode">
    <i id="theme-toggle-icon" class="fa-solid fa-moon"></i>
</button>

<div class="container">
    <h1>Toast Notification Demo</h1>
    <div class="button-group">
        <button id="success-btn">Success Toast</button>
        <button id="warning-btn">Warning Toast</button>
        <button id="error-btn">Error Toast</button>
        <button id="info-btn">Info Toast</button>
    </div>
</div>
<div id="toast-container"></div>
<footer>
    <p>Made with ❤️ by <a href="https://github.com/Ashish-CodeJourney">@Ashish-CodeJourney</a></p>
</footer>
<script src="script.js"></script>
<script src="theme.js"></script>
</body>
</html>
